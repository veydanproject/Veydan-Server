# NATS of one server of the mesh of vrelay (services/relay/deploy/cluster/nats,
# spec/cluster.md 2, spec/security.md 4), made by the kit (lib/mesh.sh) on
# every run and by veydan-server relay-peer; edits are lost. It holds the
# passwords, so it lies in /opt/vrelay/compose/secrets/nats/nats.conf, 0600 to
# the user of NATS. The account is VRELAY, as on a server alone, so that the streams
# stay where they are.

server_name: "${V_NATS_SERVER_NAME}"
listen: "${V_MESH_IP}:4222"
# Monitoring has no authentication: loopback only.
http: "127.0.0.1:8222"

# Limits (services/relay/spec/tuning.md 6). Only vrelay, the kit and the
# other regions connect: a few connections a process. The largest message is
# an event (VRELAY_LIMITS_MAX_EVENT_BYTES, 128 KiB) with its headers; the
# writer's batched answers keep under max_payload by themselves. A client
# that died without a word is let go within a minute, not four.
max_payload: 512KB
max_connections: 1024
ping_interval: "20s"
ping_max: 3

jetstream {
  # Each region its own domain: no meta group crosses the ocean (cluster.md 2.1).
  domain: "${V_R}"
  store_dir: "/data"
  max_memory_store: 512M
  max_file_store: 20G
  # A sync to the disk every second, not every two minutes: what a crash of
  # the machine loses of the queue, the gone marks and the outbox of
  # deletions (an OK waits for Cassandra, not for this).
  sync_interval: "1s"
}

${V_NATS_CLUSTER_BLOCK}

system_account: SYS

accounts {
  VRELAY {
    jetstream: enabled
    users: [
      # vrelay serve
      {
        user: serve
        password: "${V_NATS_SERVE_PASSWORD}"
        permissions: {
          publish: {
            allow: [
              "vrelay.${V_R}.write.>"
              "vrelay.live.x.>"
              "vrelay.${V_R}.presence.>"
              "vrelay.region.${V_R}"
              "$JS.API.STREAM.INFO.VRELAY_WRITE_${V_RU}"
              "$JS.API.DIRECT.GET.VRELAY_PRESENCE_${V_RU}"
              "$JS.API.DIRECT.GET.VRELAY_PRESENCE_${V_RU}.>"
              # The presence stream lives in memory: after a restart of NATS
              # serve makes it again (Bus::keep_presence), this stream only.
              "$JS.API.STREAM.INFO.VRELAY_PRESENCE_${V_RU}"
              "$JS.API.STREAM.CREATE.VRELAY_PRESENCE_${V_RU}"
            ]
            deny: [ "vrelay.${V_R}.write.gone.>" ]
          }
          subscribe: {
            allow: [ "vrelay.live.>", "vrelay.${V_R}.ack.*", "vrelay.region.*", "_INBOX.vrelay.serve.>" ]
          }
        }
      }
      # vrelay write (VRELAY_ADMIN_WRITE_MIGRATES=false), and vrelay import
      {
        user: write
        password: "${V_NATS_WRITE_PASSWORD}"
        permissions: {
          publish: {
            allow: [
              "vrelay.${V_R}.write.gone.>"
              "vrelay.live.e.>"
              "vrelay.${V_R}.ack.*"
              "vrelay.${V_R}.out.>"
              "$JS.API.STREAM.INFO.VRELAY_WRITE_${V_RU}"
              "$JS.API.STREAM.INFO.VRELAY_IN_${V_RU}"
              "$JS.API.STREAM.NAMES"
              "$JS.API.STREAM.LIST"
              "$JS.API.STREAM.MSG.GET.VRELAY_WRITE_${V_RU}"
              "$JS.API.CONSUMER.INFO.VRELAY_WRITE_${V_RU}.*"
              "$JS.API.CONSUMER.MSG.NEXT.VRELAY_WRITE_${V_RU}.*"
              "$JS.API.CONSUMER.INFO.VRELAY_IN_${V_RU}.*"
              "$JS.API.CONSUMER.MSG.NEXT.VRELAY_IN_${V_RU}.*"
              # acks, -NAK, +WPI, +TERM: NATS 2.15.3 with a domain sent
              # $JS.ACK.<stream>.<consumer>.<n>.<sseq>.<cseq>.<ts>.<pending>
              "$JS.ACK.VRELAY_WRITE_${V_RU}.>"
              "$JS.ACK.VRELAY_IN_${V_RU}.>"
            ]
          }
          subscribe: {
            allow: [ "_INBOX.vrelay.write.>", "_INBOX.vrelay.import.>" ]
          }
        }
      }
      # vrelay migrate (run by the kit), and the operator's nats tool
      {
        user: migrate
        password: "${V_NATS_MIGRATE_PASSWORD}"
        permissions: {
          # $JS.SNAPSHOT.>: the chunks of `nats stream restore` (README, a region of three)
          publish: { allow: [ "$JS.API.>", "$JS.SNAPSHOT.>", "vrelay.${V_R}.write.gone.>" ] }
          subscribe: { allow: [ "_INBOX.>" ] }
        }
      }
    ]
  }
  SYS {
    users: [
      { user: sys, password: "${V_NATS_SYS_PASSWORD}" }
    ]
  }
}

${V_NATS_LEAF_BLOCK}
