# NATS of a server of the kit (compose.kit.yaml, in place of
# compose/nats.conf): the same server, users and subjects as compose/nats.conf
# of the relay (one region: no region name in the subjects). No anonymous
# client: every user has a password (kit/nats-entrypoint.sh reads them from
# /secrets), and each mode of vrelay a user of its own that may publish and
# read what that mode needs and nothing else (spec/security.md 4.2):
#   serve    the queue, the live events that are only live (vrelay.live.x),
#            the presence; the replies on _INBOX.vrelay.serve
#   write    the stored events to the live bus (vrelay.live.e), the acks,
#            the gone marks; the consumer of the queue
#   migrate  the streams (vrelay migrate, run by the kit), and the
#            operator's nats tool
#   sys      the system account, used by no program here
# A refused subject shows in the log as a `Permissions Violation`.
server_name: $NATS_SERVER_NAME
port: 4222
# Monitoring has no authentication: compose.kit.yaml publishes it on
# loopback, where the kit's firewall lets root, vrelay and the agent alone
# reach it (vrelay-local-lock.sh).
http: 8222

jetstream {
  store_dir: /data
  max_memory_store: $NATS_JS_MAX_MEMORY
  max_file_store: $NATS_JS_MAX_FILE
}

accounts {
  VRELAY: {
    jetstream: enabled
    users: [
      # vrelay serve
      {
        user: serve
        password: $NATS_SERVE_PASSWORD
        permissions: {
          publish: {
            allow: [
              "vrelay.write.>"
              "vrelay.live.x.>"
              "vrelay.presence.>"
              "$JS.API.STREAM.INFO.VRELAY_WRITE"
              "$JS.API.DIRECT.GET.VRELAY_PRESENCE"
              "$JS.API.DIRECT.GET.VRELAY_PRESENCE.>"
              # The presence stream lives in memory: after a restart of NATS
              # serve makes it again (Bus::keep_presence), this stream only.
              "$JS.API.STREAM.INFO.VRELAY_PRESENCE"
              "$JS.API.STREAM.CREATE.VRELAY_PRESENCE"
            ]
            deny: [ "vrelay.write.gone.>" ]
          }
          subscribe: {
            allow: [ "vrelay.live.>", "vrelay.ack.*", "_INBOX.vrelay.serve.>" ]
          }
        }
      }
      # vrelay write (VRELAY_ADMIN_WRITE_MIGRATES=false), and vrelay import
      {
        user: write
        password: $NATS_WRITE_PASSWORD
        permissions: {
          publish: {
            allow: [
              "vrelay.write.gone.>"
              "vrelay.live.e.>"
              "vrelay.ack.*"
              "$JS.API.STREAM.INFO.VRELAY_WRITE"
              "$JS.API.STREAM.NAMES"
              "$JS.API.STREAM.LIST"
              "$JS.API.STREAM.MSG.GET.VRELAY_WRITE"
              "$JS.API.CONSUMER.INFO.VRELAY_WRITE.*"
              "$JS.API.CONSUMER.MSG.NEXT.VRELAY_WRITE.*"
              "$JS.ACK.VRELAY_WRITE.>"
            ]
          }
          subscribe: {
            allow: [ "_INBOX.vrelay.write.>", "_INBOX.vrelay.import.>" ]
          }
        }
      }
      # vrelay migrate (run by the kit), and the operator's nats tool
      {
        user: migrate
        password: $NATS_MIGRATE_PASSWORD
        permissions: {
          publish: { allow: [ "$JS.API.>", "$JS.SNAPSHOT.>", "vrelay.write.gone.>" ] }
          subscribe: { allow: [ "_INBOX.>" ] }
        }
      }
    ]
  }
  SYS: {
    users: [ { user: sys, password: $NATS_SYS_PASSWORD } ]
  }
}
system_account: SYS
