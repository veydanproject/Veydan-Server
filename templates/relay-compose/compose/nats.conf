# NATS of the single-server stack (compose.yaml). The values come from the
# environment of the nats service; the passwords from /secrets
# (compose/nats-entrypoint.sh). No anonymous client: every user has a
# password, and each mode of vrelay a user of its own that may publish and
# read what that mode needs and nothing else (spec/security.md 4.2, one
# region: no region name in the subjects, no outbox, no beat). The replies
# come to a prefix of its own (VRELAY_BUS_INBOX_PREFIX, `_INBOX.vrelay` by
# default): a mode reads its own replies alone. A refused subject shows in
# this log as a `Permissions Violation`.
server_name: $NATS_SERVER_NAME
port: 4222
# Monitoring has no authentication: compose.yaml publishes it on loopback.
http: 8222

jetstream {
  store_dir: /data
  max_memory_store: $NATS_JS_MAX_MEMORY
  max_file_store: $NATS_JS_MAX_FILE
}

accounts {
  VRELAY: {
    jetstream: enabled
    users: [
      # vrelay serve
      {
        user: serve
        password: $NATS_SERVE_PASSWORD
        permissions: {
          publish: {
            allow: [
              "vrelay.write.>"
              "vrelay.live.x.>"
              "vrelay.presence.>"
              "$JS.API.STREAM.INFO.VRELAY_WRITE"
              "$JS.API.DIRECT.GET.VRELAY_PRESENCE"
              "$JS.API.DIRECT.GET.VRELAY_PRESENCE.>"
              # The presence stream lives in memory: after a restart of NATS
              # serve makes it again (Bus::keep_presence), this stream only.
              "$JS.API.STREAM.INFO.VRELAY_PRESENCE"
              "$JS.API.STREAM.CREATE.VRELAY_PRESENCE"
            ]
            deny: [ "vrelay.write.gone.>" ]
          }
          subscribe: {
            allow: [ "vrelay.live.>", "vrelay.ack.*", "_INBOX.vrelay.serve.>" ]
          }
        }
      }
      # vrelay write (VRELAY_ADMIN_WRITE_MIGRATES=false)
      {
        user: write
        password: $NATS_WRITE_PASSWORD
        permissions: {
          publish: {
            allow: [
              "vrelay.write.gone.>"
              "vrelay.live.e.>"
              "vrelay.ack.*"
              "$JS.API.STREAM.INFO.VRELAY_WRITE"
              "$JS.API.STREAM.NAMES"
              "$JS.API.STREAM.LIST"
              "$JS.API.STREAM.MSG.GET.VRELAY_WRITE"
              "$JS.API.CONSUMER.INFO.VRELAY_WRITE.*"
              "$JS.API.CONSUMER.MSG.NEXT.VRELAY_WRITE.*"
              "$JS.ACK.VRELAY_WRITE.>"
            ]
          }
          subscribe: {
            allow: [ "_INBOX.vrelay.write.>", "_INBOX.vrelay.import.>" ]
          }
        }
      }
      # vrelay migrate (the one-shot vrelay-migrate), and the operator's nats tool
      {
        user: migrate
        password: $NATS_MIGRATE_PASSWORD
        permissions: {
          publish: { allow: [ "$JS.API.>", "$JS.SNAPSHOT.>", "vrelay.write.gone.>" ] }
          subscribe: { allow: [ "_INBOX.>" ] }
        }
      }
    ]
  }
  # The system account, a user of its own, used by no program here.
  SYS: {
    users: [ { user: sys, password: $NATS_SYS_PASSWORD } ]
  }
}
system_account: SYS
