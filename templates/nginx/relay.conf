# Relay wss://${V_HOST} → vguard 127.0.0.1:7778 → strfry 127.0.0.1:7777. Made by run.sh.
#
# Only with the API key: ?key=<key> (what the app sends) or the header
# X-API-Key. The app key and the peer key are in 10-keys.conf.
#
# The WebSockets go to ${V_RELAY_WS}: vguard, the read policy in front of
# strfry (components/guard.sh), or strfry itself when the kit has no
# vguard. A request without Upgrade (NIP-11, the page of strfry) goes to
# strfry: it cannot become a WebSocket there.
map $http_upgrade $veydan_relay_backend {
    ""      127.0.0.1:7777;
    default ${V_RELAY_WS};
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${V_HOST} ${V_ALIASES};

    ssl_certificate     ${V_CERT};
    ssl_certificate_key ${V_CERT_KEY};
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/veydan-relay.access.log veydan_nokey;
    # crit: lower levels print the request line, and with it the key.

    # Certificate renewals: Cloudflare may send the ACME check here over
    # https. Before the key check and the limits.
    location ^~ /.well-known/acme-challenge/ {
        root ${V_ACME};
    }
    error_log  /var/log/nginx/veydan-relay.error.log crit;

    # strfry's Prometheus page is for this host only.
    location ^~ /metrics {
        return 404;
    }

${V_MANIFEST_LOCATION}
    location / {
        if ($veydan_relay_denied) {
            return 401;
        }
        limit_req  zone=veydan_relay burst=20 nodelay;
        limit_conn veydan_conn 20;

        # $uri: the query (with the key) stops here.
        proxy_pass http://$veydan_relay_backend$uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $veydan_connection_upgrade;
        proxy_set_header Host $host;
        # strfry's realIpHeader. Set here, never passed on from the client.
        proxy_set_header X-Real-IP $remote_addr;
        # A peer of the mesh (the key of the peers): vguard lets it read
        # everything. Set here: a client's own X-Veydan-Role never passes.
        proxy_set_header X-Veydan-Role $veydan_relay_role;
        # Above strfry's autoPingSeconds (55), so idle sockets stay open.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
