# The relays of the mesh through nginx: strfry router and sync connect to
# ws://127.0.0.1:7780/peer/<name>/, nginx opens the wss connection to the
# peer, checks its certificate and adds the peer key as a header. The key is
# in this file only (0600 root): not in the URL of strfry, its argv or the
# journal. Made by run.sh from MESH_RELAYS.
${V_PEER_TLS_NOTE}
server {
    listen 127.0.0.1:7780;
    access_log off;
    error_log /var/log/nginx/veydan-relay-peers.error.log crit;

${V_PEER_LOCATIONS}
}
