    # Not uploaded through this server, and the network keeps files on the
    # disks of its servers: the next media server is asked. A request that
    # came from another server is not passed on again (X-Veydan-Mesh).
    location @elsewhere {
        if ($http_x_veydan_mesh) { return 404; }
        proxy_pass https://${V_MESH_NEXT};
        proxy_http_version 1.1;
        proxy_set_header Host ${V_MESH_NEXT};
        proxy_set_header X-Veydan-Mesh 1;
        proxy_set_header Range $http_range;
        proxy_ssl_server_name on;
        proxy_ssl_name ${V_MESH_NEXT};
        proxy_ssl_verify on;
        # Let's Encrypt: leaf, intermediate, root (the default depth is 1).
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_intercept_errors on;
        error_page 400 403 404 500 502 503 504 =404 @none;

        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location @none { return 404; }
