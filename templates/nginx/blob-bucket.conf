    # Not uploaded through this server: the bucket of the network has it
    # under its hash. The bucket is private; nginx signs the request
    # (templates/njs/s3.js) with the keys of the server, and the client sees
    # nothing of the bucket but the bytes.
    location @elsewhere {
        # The path signed and the path sent are one. The host of the bucket
        # is resolved when asked, not when nginx starts: a bucket whose name
        # does not resolve must not keep the sites of this server from starting.
        # (Both variables before the rewrite: its "break" ends the "set"s.)
        set $s3_path "/${V_S3_BUCKET}$uri";
        set $s3_upstream "${V_S3_HOST}";
        rewrite ^ $s3_path break;
        resolver ${V_RESOLVER} valid=300s ipv6=off;
        proxy_pass ${V_S3_SCHEME}://$s3_upstream;
        proxy_ssl_name ${V_S3_NAME};
        proxy_http_version 1.1;
        proxy_set_header Host ${V_S3_HOST};
        proxy_set_header x-amz-date $s3_date;
        proxy_set_header x-amz-content-sha256 e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855;
        proxy_set_header Authorization $s3_auth;
        proxy_set_header Range $http_range;
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-meta-filename;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Etag;
        proxy_hide_header Last-Modified;
        proxy_hide_header Server;
        proxy_hide_header CF-RAY;
        proxy_hide_header CF-Cache-Status;
        # Whatever the bucket says besides the bytes is "no such blob".
        proxy_intercept_errors on;
        error_page 400 403 404 500 502 503 504 =404 @none;

        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location @none { return 404; }
