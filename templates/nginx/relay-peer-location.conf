    location /peer/${V_PEER_FQDN}/ {
        proxy_pass https://${V_PEER_FQDN}/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $veydan_connection_upgrade;
        proxy_set_header X-API-Key ${V_PEER_KEY};
        proxy_ssl_server_name on;
        proxy_ssl_name ${V_PEER_FQDN};
        proxy_ssl_verify ${V_PEER_VERIFY};
        # Let's Encrypt: leaf, intermediate, root (the default depth is 1).
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        # Above strfry's autoPingSeconds (55), so idle sockets stay open.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
