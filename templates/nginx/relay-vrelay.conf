# Relay wss://${V_HOST} → vrelay serve ${V_RELAY_WS} and its other loopback
# addresses (RELAY_ENGINE=vrelay, components/vrelay.sh). Made by run.sh.
#
# nginx does TLS and passes every request as it came: the WebSockets, NIP-11
# and the rest of plain HTTP go to one listener of vrelay (on several
# loopback addresses, below), plain, with the query (the key) and the header X-API-Key as the client
# sent them. vrelay decides: the gate (the app key or the peer key, none on a
# channel server), the role (a peer by the peer key itself, never by a
# header), the limits of an address (RELAY_IP_* of server.conf, in
# vrelay.env, by the address nginx names in X-Real-IP; nginx does not count
# the WebSockets a second time here, only the plain paths before vrelay's
# gate, below). The gate of nginx ($veydan_relay_gate,
# 10-keys.conf) stays in front, the same keys: a request without one never
# reaches vrelay.

# vrelay serve listens on port 7781 of several loopback addresses
# (VRELAY_NET_LISTEN): a source port of nginx is unique for each address it
# connects to, so the connections are not capped by ip_local_port_range
# (28 232 an address). The fewest connections first; a listener that
# refuses is skipped for the next (proxy_next_upstream), never marked down,
# so a restart of vrelay is over when vrelay is back.
upstream veydan_vrelay {
    least_conn;
${V_VRELAY_UPSTREAM}
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${V_HOST} ${V_ALIASES};

    ssl_certificate     ${V_CERT};
    ssl_certificate_key ${V_CERT_KEY};
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # $uri only: the query (with the key) is never written; the address,
    # status and connect time of vrelay say what the error log no longer does.
    access_log /var/log/nginx/veydan-relay.access.log veydan_relay;

    # Certificate renewals: Cloudflare may send the ACME check here over
    # https. Before the key check and the limits.
    location ^~ /.well-known/acme-challenge/ {
        root ${V_ACME};
    }
    # emerg: a line of any other level about a request ends with the
    # request line and the URL of the upstream, the query and the key with
    # them (crit too: "connect() to 127.0.0.1:7781 failed (99: Cannot assign
    # requested address) ..., request: "GET /?key=..."). nginx writes emerg
    # for its configuration alone; a failure of vrelay is a 502 in the
    # access log above.
    error_log  /var/log/nginx/veydan-relay.error.log emerg;

    location ^~ /metrics {
        return 404;
    }

${V_MANIFEST_LOCATION}
${V_ACCESS_LOCATION}
    # The paths vrelay answers before its own gate, with no WebSocket: the
    # manifest, /_access, the access API where no location above takes it.
    # Each is a request, a task of vrelay and maybe a signature to check:
    # limited here too, by the zone of the relay (RELAY_IP_CONNECTS_PER_SEC
    # a second, RELAY_IP_CONNECT_BURST at once, of server.conf), as the
    # site of the other engine limits location /; never below the access API's own (10
    # joins and 60 signed requests a minute, vrelay counts them).
    location ~ ^/(manifest\.json$|_access(/|$)|\.well-known/veydan-access/) {
        if ($veydan_relay_gate) {
            return 401;
        }
        limit_req zone=veydan_relay burst=${V_RELAY_IP_CONNECT_BURST} nodelay;

        proxy_pass http://veydan_vrelay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Veydan-Role "";
        proxy_read_timeout 30s;
    }

    location / {
        if ($veydan_relay_gate) {
            return 401;
        }
        # A path nginx made into this one (/_access/.., /%5Faccess/%2e%2e)
        # would reach vrelay as it came, past the limit above: a dot
        # segment, a double slash or an encoded dot or slash is never a path
        # of the relay here.
        if ($request_uri ~ "^[^?]*(/\.|//|%2[eEfF])") {
            return 404;
        }

        # No URI: the request line goes as it came, the query with it.
        proxy_pass http://veydan_vrelay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $veydan_connection_upgrade;
        proxy_set_header Host $host;
        # The client's address as nginx sees it (behind Cloudflare, from
        # CF-Connecting-IP of Cloudflare's own addresses: 05-cloudflare.conf).
        # Set here, never passed on from the client; vrelay believes it from
        # 127.0.0.1 only (VRELAY_GATE_TRUSTED_PROXIES).
        proxy_set_header X-Real-IP $remote_addr;
        # The old stack's role header: vrelay reads none, and a client's own
        # never passes.
        proxy_set_header X-Veydan-Role "";
        # Above vrelay's ping (VRELAY_NET_PING_SECS 55) and its idle time
        # (VRELAY_NET_IDLE_SECS 300), so vrelay closes an idle socket, not nginx.
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}
