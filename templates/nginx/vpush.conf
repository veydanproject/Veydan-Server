# Push https://${V_HOST}/ → vpush 127.0.0.1:8090. Made by run.sh.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${V_HOST} ${V_ALIASES};

    ssl_certificate     ${V_CERT};
    ssl_certificate_key ${V_CERT_KEY};
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/veydan-vpush.access.log veydan_nokey;
    error_log  /var/log/nginx/veydan-vpush.error.log;

    # Certificate renewals: Cloudflare may send the ACME check here over
    # https. Before the key check and the limits.
    location ^~ /.well-known/acme-challenge/ {
        root ${V_ACME};
    }

    # VPush refuses more itself (server.max_body_bytes); this stops it earlier.
    client_max_body_size 64k;

${V_VLINK_LOCATION}
${V_MANIFEST_LOCATION}
    location / {
        limit_req zone=veydan_push burst=20 nodelay;

        # No path after the address: the request goes on exactly as it came.
        # Registration checks a signature over the full URL.
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Whom VPush counts registrations against (server.trusted_proxy).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
