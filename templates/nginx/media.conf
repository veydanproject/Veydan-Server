# Media https://${V_HOST}/ → blossom 127.0.0.1:3000. Made by run.sh.
#
# A download needs no key: the app reads media without the relay key. With
# MEDIA_UPLOAD_KEY=required a write (PUT/HEAD /upload, /mirror, DELETE of a
# blob) needs the app key or the peer key (10-keys.conf, the same check as
# the relay); with "open" it does not. An upload is signed by the uploader's
# nostr key (kind 24242) either way.
#
# A blob is served by the blossom of this server when this server took the
# upload; otherwise ${V_BLOB_FALLBACK_NOTE}.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${V_HOST} ${V_ALIASES};

    ssl_certificate     ${V_CERT};
    ssl_certificate_key ${V_CERT_KEY};
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/veydan-media.access.log veydan_nokey;
    error_log  /var/log/nginx/veydan-media.error.log;

    # Certificate renewals: Cloudflare may send the ACME check here over
    # https. Before the key check and the limits.
    location ^~ /.well-known/acme-challenge/ {
        root ${V_ACME};
    }

    # The dashboard is off in config.yml; this keeps it off from outside.
    location ^~ /admin {
        return 404;
    }

    # A blob by its hash: this server's blossom first, then the network.
    location ~ "^/[0-9a-f]{64}(\.[a-z0-9]+)?$" {
        # GET and HEAD of a blob are open; DELETE needs the key (when MEDIA_UPLOAD_KEY=required).
${V_MEDIA_KEY_GUARD}
        limit_req zone=veydan_media burst=60 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_intercept_errors on;
        # Not here, or the blossom of this server is down: the network has it.
        error_page 404 502 503 504 = @elsewhere;

        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

${V_BLOB_FALLBACK}

${V_VAULT_LOCATION}
${V_MEDIA_AUTH_LOCATION}
${V_CLOUD_LOCATION}
${V_MANIFEST_LOCATION}
    location / {
        # Upload and mirror: the key first, then the limits. GET (the list) stays open.
${V_MEDIA_KEY_GUARD}
        limit_req zone=veydan_media burst=60 nodelay;
${V_MEDIA_ROOT_GUARD}
        # The largest chunk is 16 MiB; blossom itself refuses above 20 MiB.
        client_max_body_size 20m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # Nothing here is meant for a browser page.
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
