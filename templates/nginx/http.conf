# Veydan: what all sites of this server share (http context).
# Made by run.sh; edits are lost on the next run. (server_tokens is
# already off in Debian 13's nginx.conf.)

# The key maps (10-keys.conf) hold 64-character keys.
map_hash_bucket_size 128;

# Signed reads of the bucket of the network, for the media site.
js_import s3 from ${V_NJS}/s3.js;
js_var $s3_ts;
js_set $s3_date s3.date;
js_set $s3_auth s3.authorization;

# No query string in the logs: the relay's API key travels in it.
log_format veydan_nokey '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

limit_req_zone  $binary_remote_addr zone=veydan_relay:10m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=veydan_media:10m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=veydan_push:10m  rate=10r/s;
limit_conn_zone $binary_remote_addr zone=veydan_conn:10m;

map $http_upgrade $veydan_connection_upgrade {
    default upgrade;
    ''      close;
}
