# VCall, the node of calls on this server. Made by run.sh once, then
# yours: a rerun leaves it and writes a changed template as vcall.env.new.
# Read by the unit (EnvironmentFile); every name is in services/call/README.md.
# Apply: systemctl restart vcall

# Control and TURN over TLS. nginx holds 443 on every server of this kit, so
# the node takes another port; clients learn it from the manifest or the
# registry, never from a constant.
VCALL_LISTEN=0.0.0.0:${V_CALL_PORT}
# STUN and TURN over UDP and TCP (the unit's default, said again here).
VCALL_TURN_LISTEN=0.0.0.0:3478
# The address the relayed traffic is seen at: the server's public IPv4.
VCALL_PUBLIC_IP=${V_CALL_PUBLIC_IP}
# One UDP port per TURN allocation, first-last; the firewall opens the same.
VCALL_RELAY_PORTS=${V_CALL_RELAY_PORTS}
# The SFU of groups, UDP and TCP.
VCALL_SFU_LISTEN=0.0.0.0:${V_CALL_SFU_PORT}
# A hint for clients in the registry's list.
VCALL_REGION=${V_REGION}
# The registry of the mesh, where the node reports in every few minutes
# (POST /vlink/v1/calls/register). Empty: the node is in the manifest
# alone.
${V_CALL_REGISTRY_LINE}
VCALL_LOG=info
