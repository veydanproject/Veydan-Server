##
## strfry of the Veydan relay ${V_RELAY_FQDN}. Made by run.sh once, then
## yours: a rerun leaves it and writes a changed template as strfry.conf.new.
## Apply: systemctl restart strfry
##

db = "/opt/strfry/data/"

dbParams {
    maxreaders = 256
    # Size of the mmap, not of the disk used.
    mapsize = 10995116277760
    noReadAhead = false
}

events {
    # The app's largest event: a chat message with a media descriptor.
    maxEventSize = 131072
    rejectEventsNewerThanSeconds = 900
    # Gift wraps (kind 1059) carry a created_at up to two days in the past.
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    # Only nginx reaches it; nginx checks the API key and does TLS.
    bind = "127.0.0.1"
    port = 7777

    # 0: the limit comes from systemd (LimitNOFILE in strfry.service).
    nofiles = 0

    # nginx names the client here, so limits and logs see the real address.
    realIpHeader = "x-real-ip"

    auth {
        enabled = true
        serviceUrl = "wss://${V_RELAY_FQDN}"
    }

    info {
        name = "${V_RELAY_NAME}"
        description = "${V_NETWORK} messenger relay"
        pubkey = "${V_ADMIN_PUBKEY}"
        self = ""
        contact = ""
        icon = ""
        banner = ""
        privacy = ""
        terms = ""
        nips = ""
    }

    # Larger than maxEventSize: the frame carries the event and its wrapping.
    maxWebsocketPayloadSize = 262144
    maxReqFilterSize = 200
    # Below nginx's proxy_read_timeout (300 s), so idle sockets stay open.
    autoPingSeconds = 55
    enableTcpKeepalive = false
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 500
    maxFilterLimitCount = 1000000
    maxSubsPerConnection = 200

    writePolicy {
        plugin = ""
        timeoutSeconds = 10
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 3
        reqWorker = 3
        reqMonitor = 3
        negentropy = 2
    }

    # NIP-77: strfry sync between our relays, and the app's sync later.
    negentropy {
        enabled = true
        maxSyncEvents = 1000000
    }

    # Off: requireAuthorOrTag knows only authors, #p and #e, and the app
    # asks for group events by #h.
    filterValidation {
        enabled = false
        maxFiltersPerReq = 3
        minFiltersPerReq = 1
        maxKindsPerFilter = 3
        allowedKinds = ""
        requireAuthorOrTag = false
    }
}
