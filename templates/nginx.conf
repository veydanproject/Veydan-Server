# Made by run.sh (components/nginx-official.sh); edits are lost on the next run.
# nginx of nginx.org in the layout of Debian 13: workers as www-data (the
# owner of /opt/veydan/media-keys and of the ACME answers), the pid file of
# nginx.org's unit, the modules of modules-enabled (njs:
# 50-official-njs.conf), conf.d (veydan.conf) and sites-enabled. The
# connections of a worker are NGINX_WORKER_CONNECTIONS of server.conf (a
# WebSocket of the relay takes two), its files twice that.
user www-data;
worker_processes auto;
worker_cpu_affinity auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
worker_rlimit_nofile 65536;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 32768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # A site without a log of its own (port 80, the names this server does
    # not serve) writes here: the path without the query, where a client may
    # have put the key of the network (?key=), and nothing else it sent.
    log_format veydan_main '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log veydan_main;

    gzip on;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
