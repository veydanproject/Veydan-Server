# The host of vrelay's Cassandra and NATS (services/relay/spec/tuning.md 4),
# laid by components/vrelay.sh; edits are lost on the next run.
# Cassandra maps its index files: many maps a process.
vm.max_map_count = 1048575
# Swap only to save the machine, never the JVM's heap (its container has no
# swap of its own: memswap_limit).
vm.swappiness = 1
vm.zone_reclaim_mode = 0
# A peer gone without a word (a provider's network, WireGuard) is found in
# two minutes, not two hours, on the sockets that ask for keepalive.
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 6
# Room for one stream of Cassandra or one leaf link across the ocean (82 ms:
# 16 MB carry 1.5 Gbit/s).
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
