# The settings of vrelay serve and vrelay write (services/relay/spec/config.md:
# every name is VRELAY_<SECTION>_<NAME>; `vrelay config print --mode serve`
# shows what is in effect and where each value came from). No secret is in
# this file: each is a file named by a _FILE setting.
#
# The lines between the two marks are the kit's, written anew from
# server.conf on every run (components/vrelay.sh); a setting of your own goes
# below the end mark, under a name the block does not set.
# --- kit begin
# Behind nginx (TLS on 443): plain sockets on loopback. The WebSockets, NIP-11
# and the access API on the first (port 7781 of several loopback addresses:
# nginx has a source port for each address, so the ports of the kernel do
# not cap the connections); the access API alone on the second (what nginx
# asks for the media of a team or channel server).
VRELAY_NET_LISTEN=${V_VRELAY_LISTEN}
VRELAY_NET_HTTP_LISTEN=127.0.0.1:7782
VRELAY_TLS_MODE=off
VRELAY_NET_MAX_CONNECTIONS=${V_RELAY_MAX_CONNECTIONS}
VRELAY_NET_IP_MAX_CONNECTIONS=${V_RELAY_IP_MAX_CONNECTIONS}
VRELAY_NET_IP6_NET_MAX_CONNECTIONS=${V_RELAY_IP6_NET_MAX_CONNECTIONS}
VRELAY_NET_IP_CONNECTS_PER_SEC=${V_RELAY_IP_CONNECTS_PER_SEC}
VRELAY_NET_IP_CONNECT_BURST=${V_RELAY_IP_CONNECT_BURST}

# The keys (MESH_APP_KEY, MESH_PEER_KEY of server.conf): the peer key makes a
# peer, whatever a header says. nginx alone is believed about the address of
# a client (X-Real-IP, set by nginx from its own view, Cloudflare's header
# from Cloudflare's addresses only).
VRELAY_GATE_APP_KEY_FILE=${V_VRELAY_KEYS}/app-key
VRELAY_GATE_PEER_KEY_FILE=${V_VRELAY_KEYS}/peer-key
VRELAY_GATE_TRUSTED_PROXIES=127.0.0.1/32,::1/128
VRELAY_GATE_REAL_IP_HEADER=x-real-ip
VRELAY_GATE_PROXY_PROTOCOL=false

# The names of the relay: RELAY_HOST and RELAY_ALIASES.
VRELAY_AUTH_RELAY_HOSTS=${V_VRELAY_HOSTS}

${V_VRELAY_POLICY}

# Who uses the relay (ACCESS_MODE): the files of vrelay, also written by its
# command line (veydan-server members, invite: vrelay access).
VRELAY_ACCESS_MODE=${V_ACCESS_MODE}
${V_VRELAY_ACCESS}

# The statistics for the agent of vcloud (services/relay/spec/stats.md):
# loopback alone; vrelay write's listener is in vrelay-write.env.
${V_VRELAY_STATS}

${V_VRELAY_STORE_BUS}
# The tables and the streams are made by the kit (vrelay migrate, as the
# superuser of Cassandra): vrelay's role may not make a keyspace.
VRELAY_ADMIN_SERVE_MIGRATES=false
VRELAY_ADMIN_WRITE_MIGRATES=false

# RELAY_RETENTION_DAYS of server.conf (0: for ever).
VRELAY_RETENTION_DAYS=${V_RETENTION_DAYS}

# NIP-11.
VRELAY_INFO_NAME="${V_RELAY_NAME}"
VRELAY_INFO_DESCRIPTION="${V_NETWORK} messenger relay"
VRELAY_INFO_PUBKEY=${V_ADMIN_PUBKEY}
# --- kit end
