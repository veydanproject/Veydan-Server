# Pinned versions. An update of a server program is a decision, not a side
# effect of a reinstall: change a line here, then run ./install.sh again.

# strfry relay, built on the server from this tag. The commit is checked
# after the checkout, so a moved tag is refused.
STRFRY_REPO=https://github.com/hoytech/strfry.git
STRFRY_TAG=1.1.3
STRFRY_COMMIT=16c00df04e264f4d68db5e10a48127f015c7824b

# blossom-server (hzrd149). The same commit as on node-1. It runs on Deno 2.
BLOSSOM_REPO=https://github.com/hzrd149/blossom-server.git
BLOSSOM_COMMIT=32567afb15255c171817a78ed2861cd9e57bf4de

# Deno for blossom: the official build, checked by its sha256.
DENO_VERSION=v2.9.7
DENO_SHA256=c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490

# libsql-server (sqld): the index of the blobs a media server stored, one
# on every media server. The official build, checked by
# its sha256.
LIBSQL_VERSION=libsql-server-v0.24.32
LIBSQL_SHA256=71720fc8648c19efef416efebd47145ef59b62e198770533530a858e1336879f

# Our own programs, for a kit made from the releases (scripts/server/make.sh
# <name> release): the version of each on GitHub, under v<version>, checked
# by the SHA256SUMS of the release. Empty: no release yet, the local build.
VCALL_VERSION=0.1.0
VPUSH_VERSION=
VLINK_VERSION=0.3.2
# vguard, the read policy in front of strfry (components/guard.sh): from
# the release of Veydan-Push that carries it. Empty: the kit's bin/vguard
# (make build-deploy), else the relay goes without it, with a warning.
VGUARD_VERSION=

# The registry of the Veydan network: where a node of calls a volunteer puts
# up (--volunteer) reports in. A bridge knows the same address by itself; a
# network of one's own names its registry in server.conf
# (VLINK_REGISTRY_HOST).
VEYDAN_REGISTRY=https://hub.veydan.net/vlink
